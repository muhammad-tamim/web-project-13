<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger King</title>
    <link rel="shortcut icon" href="./assets/images/burger_king_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>
    <header>
        <!-- Navbar -->
        <nav class="navbar flex between wrapper">
            <a href="#" class="logo">Burger King</a>

            <!-- Desktop Menu -->
            <ul class="navlist flex gap-3">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="#">Locations</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="desktop-action flex gap-2">
                <a href="#" class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-value">0</span>
                </a>
                <a href="#" class="btn">
                    Sign In &nbsp; <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </a>
                <a href="#" class="hamburger">
                    <i class="fa-solid fa-bars"></i>
                </a>
            </div>

            <!-- Mobile Menu -->
            <ul class="mobile-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="#">Locations</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#" class="btn">
                        Sign In &nbsp; <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a></li>
            </ul>

        </nav>

        <!-- Hero Section-->
        <section>
            <div class="hero-section flex wrapper gap-4">
                <div class="content">
                    <h1>Enjoy Your Delicious <span>Food</span></h1>
                    <p class="para">We will fill your tummy with delicious<br>
                        food with fast delivery.</p>

                    <div class="flex gap-2">
                        <a href="#" class="btn">Order Now</a>
                        <a href="#" class="social-icon">
                            <i class="fa-brands fa-x-twitter"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fa-brands fa-google"></i>
                        </a>
                    </div>
                </div>

                <div class="image-container">
                    <img src="./assets/images/delivery-boy.png" alt="">
                </div>
            </div>
        </section>
    </header>
    <main></main>
    <footer></footer>
    <script src="scripts/script.js"></script>
</body>

</html>
